[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens"
version = "0.1.0"
description = "AI 데이터 품질 관리 플랫폼 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pymongo>=4.13",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openai>=1.99",
    # 민원 분석(PRD 6장): 군집화·배정·핵심어
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.7",
    "kiwipiepy>=0.20",
]

[project.optional-dependencies]
# 로컬 문장 임베딩(bge-m3). torch를 함께 설치하므로 분석을 돌리는 곳에만 설치한다
analysis = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    # Starlette TestClient용(openai도 httpx2를 쓴다)
    "httpx2>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    # 테스트에서 XLS(구형 엑셀) 파일을 만들 때만 쓴다
    "xlwt>=1.3",
    # DB 없이 로컬 실행·통합 테스트용 임시 MongoDB(scripts/dev_server.py)
    "pymongo-inmemory>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ANN401: typing.Any 금지 (CLAUDE.md 코드 규칙)
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# xlrd·xlwt는 타입 정보를 제공하지 않는다
module = [
    "xlrd", "xlrd.*", "xlwt", "pymongo_inmemory",
    # 분석 패키지 중 타입 정보가 없는 것
    "sklearn", "sklearn.*", "umap", "umap.*", "kiwipiepy", "kiwipiepy.*",
    "sentence_transformers", "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
